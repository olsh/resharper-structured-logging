name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the packages to JetBrains Marketplace and create the GitHub release
        type: boolean
        default: false

concurrency:
  # A dispatched release gets a group to itself, keyed on the run, so that a push landing while it
  # publishes cannot cancel it half way through. Pull request runs keep superseding theirs
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  # A push to master can publish too, so those runs are left alone for the same reason
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  build:
    name: Build and test
    runs-on: windows-2025

    permissions:
      contents: read

    outputs:
      version: ${{ steps.version.outputs.value }}
      publish: ${{ steps.publish-decision.outputs.value }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The publish decision below compares this commit against the one the push started from
          fetch-depth: 0

      # A new SDK is the only change that has to reach users as a new build, and it is what the SDK
      # update workflow merges here, so an SdkVersion change landing on master is a release. Every
      # other release stays a manual dispatch with the publish input
      - name: Decide whether to publish
        id: publish-decision
        shell: bash
        env:
          DISPATCHED_PUBLISH: ${{ inputs.publish }}
          PUSHED_FROM: ${{ github.event.before }}
        run: |
          set -euo pipefail

          read_sdk_version() {
            sed -n 's:.*<SdkVersion>\(.*\)</SdkVersion>.*:\1:p'
          }

          publish=false

          # Stripping the zeros empties the all-zero SHA that a branch creation reports, which has no
          # Directory.Build.props to compare against
          if [ "$DISPATCHED_PUBLISH" = "true" ]; then
            publish=true
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/master" ] && [ -n "${PUSHED_FROM//0/}" ]; then
            previous=$(git show "$PUSHED_FROM:Directory.Build.props" 2>/dev/null | read_sdk_version || true)
            current=$(read_sdk_version < Directory.Build.props)

            if [ -n "$previous" ] && [ "$previous" != "$current" ]; then
              echo "The JetBrains SDK went from $previous to $current, so this push is a release"
              publish=true
            fi
          fi

          echo "value=$publish" >> "$GITHUB_OUTPUT"

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            build.gradle
            settings.gradle
            gradle.properties
            gradle/wrapper/gradle-wrapper.properties

      - name: Validate solution
        run: dotnet sln ReSharper.Structured.Logging.slnx list

      - name: Test ReSharper plugin
        run: .\build.cmd Test --configuration Release

      - name: Pack ReSharper plugin
        run: .\build.cmd Pack --configuration Release

      - name: Test Rider plugin
        run: .\build.cmd Test --configuration Release --is-rider-host

      - name: Pack Rider plugin
        run: .\build.cmd PackRiderPlugin --configuration Release --is-rider-host

      - name: Upload ReSharper package
        uses: actions/upload-artifact@v7
        with:
          name: resharper-package-${{ env.EXTENSION_VERSION }}
          path: ReSharper.Structured.Logging.${{ env.EXTENSION_VERSION }}.nupkg
          if-no-files-found: error

      - name: Upload Rider package
        uses: actions/upload-artifact@v7
        with:
          name: rider-package-${{ env.EXTENSION_VERSION }}
          path: rider-structured-logging-${{ env.EXTENSION_VERSION }}.zip
          if-no-files-found: error

      # The pack targets export EXTENSION_VERSION into the job environment, which the release job
      # cannot see, so hand it over as a job output instead
      - name: Expose extension version
        id: version
        run: echo "value=$env:EXTENSION_VERSION" >> $env:GITHUB_OUTPUT

      - name: Publish ReSharper plugin
        if: steps.publish-decision.outputs.value == 'true'
        env:
          MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: .\build.cmd PublishReSharperPlugin --configuration Release

      - name: Publish Rider plugin
        if: steps.publish-decision.outputs.value == 'true'
        env:
          MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: .\build.cmd PublishRiderPlugin --configuration Release --is-rider-host

  release:
    name: Create GitHub release
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Tag the commit and publish release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ -z "$VERSION" ]; then
            echo "::error::The build job did not report an extension version"
            exit 1
          fi

          # EAP builds carry a prerelease suffix, for example 2025.1.0.373-eap02
          case "$VERSION" in
            *-*) prerelease=--prerelease ;;
            *) prerelease= ;;
          esac

          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes $prerelease
